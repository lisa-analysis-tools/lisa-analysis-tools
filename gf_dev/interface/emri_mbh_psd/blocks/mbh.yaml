type: mbh
priors: {class: mojitolight.MBHBPrior}
waveform:
  class: PhenomTHMTDIWaveform
  kwargs:
    waveform_kwargs:
      higher_modes: [21, 33, 44]
      include_negative_modes: true
      t_low_fit: true
      coarse_grain: false
      atol: 1e-12
      rtol: 1e-12
    tdi_generation: 2nd generation
    tdi_channels: XYZ
    order: 30
    Tobs: 2629845.8136287993  # 1 / 12 * YRSID_SI: waveform length only, not the data's
    start_freq: 7e-5
    use_reference_time: true
    buffer_time: 15000
    fft_batch_size: 2
num_prop_repeats: 50
tempering: {ratio: 1.2}  # over sampler.ntemps
inner_moves:
  - {class: StretchMove, weight: 0.35}
  - {class: DEMove, weight: 0.3}
  - {class: SkyMove, weight: 0.05, kwargs: {which: lat}}
  - {class: SkyMove, weight: 0.05, kwargs: {which: long}}
  - {class: SkyMove, weight: 0.05, kwargs: {which: both}}
  # ConditionalFlowMove (weight 0.2) comes with WP-D
search:
  search_type: catalog
  spread: [1e-4, 1e-3, 1e-3, 1e-3, 1e-3, 1e-1, 1e-1, 1e-1, 1e-2, 1e-2, 1]
# pe_move: default TDMBHSpecialMove {permute_every: 100, pad_out_of_prior, run_async, run_threaded, randomize_split}
links:
  waveform_model_code_link: https://github.com/Erebor-L2D/LISAanalysistools/blob/9d63bb1e63e7b8f640d3780551d9421df5245992/src/lisatools/sources/bbh/waveform.py#L130
  prior_model_code_link: https://priors-database-f0027f.gitlab.io/mojito_light_1a.html#massive-black-hole-binaries-mbhb
