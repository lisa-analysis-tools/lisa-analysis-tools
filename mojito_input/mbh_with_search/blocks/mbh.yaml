  # model:
  #   class: ZukoFlow
  #   kwargs: {flow_class: NSF, transforms: 8, hidden_features: [128, 128, 128], bins: 8}
  # data_transform:
  #   class: WhiteningTransform
  #   kwargs: {shared: false, periodic_in_cholesky: true}
  # trainer:
  #   epochs_per_round: 150
  #   min_train_samples: 2000
  #   max_buffer_samples: 6000
  #   refit_transform_every: 1
  #   torch_num_threads: 2
  #   plot_corner: true
  #   fit_kwargs: {batch_size: 1024, lr: 1e-3, lr_annealing: true, optimizer: adamw, patience: 30,
  #                validation_fraction: 0.2, val_split: temporal, train_noise: 0.0}
search:
  # search_type: point_estimate
  # search_path: /data/asantini/globalfit/erebor_org_setup/search_results/mbh/point_estimates.npy
  # parameters_searched: ['logM', 'logq', 's1z', 's2z', 'cos_iota', 'psi', 'alpha', 'sin_delta', 't_c']
  search_type: catalog
  spread: [1e-4, 1e-3, 1e-3, 1e-3, 1e-3, 1e-3, 1e-1, 1e-1, 1e-2, 1e-2, 1e-1]
pe_move: 
  class: TDMBHSpecialMove
  kwargs: {permute_every: 20, pad_out_of_prior: true, run_async: true, run_threaded: true, randomize_split: true}
links:
