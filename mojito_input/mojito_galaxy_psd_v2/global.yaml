# Joint fit of the galaxy (GB block, GBs and VGBs), the instrument noise and the galactic foreground on 713 days of
# Mojito light, started from the galaxy search's candidates, as mojito_galaxy_psd_v1, with every GB RJ move: the prior
# move (0.2 of the burn-in, 0.5 of the kept steps), the F-statistic search move (0.4, 0.2) and the F-statistic split and
# merge (0.4, 0.3). The GB moves and the recipe file come from the Spider runs from 8 mHz up. Paths are Azzurra's.
schema_version: 1
run:
  name: mojito_galaxy_psd_v2
  # ! The run resumes from a backend file of its name in this folder, so every new run needs its own folder.
  output_dir: /workspace/rrondeel/erebor_dev/global_fit_runs/mojito_galaxy_psd_v2/
  seed: 20261111  # the seed of the Spider runs from 8 mHz up
  # An upper bound: the run stops when its booking ends. The burn-in length is BURN_IN_ITERATIONS in the recipe file.
  num_iterations: 500
  backup_iter: 5

sampler:
  nwalkers: 32  # decided for these runs
  ntemps: 12  # the ladder of gb.yaml: ratio 1.2, hottest rung at T 10

compute:
  gpus: [0, 1]  # 16 walkers per card, as mojito_galaxy_psd_v1
  backend: cuda13x
  head_rank: 1
  main_rank: 0

data:
  loader: mojito_l1
  path: /workspace/ggfitlisa/ldc/mojito_light/
  # Galactic binaries, verification binaries and noise, no massive black hole binaries (decided for these runs)
  source_types: [gb, vgb, noise]
  # On the host: the setup rebuilds the orbits on the device and never reads this copy's arrays.
  orbits: {type: l1, frame: icrs, armlength: 2493162305.42235, force_backend: cpu}
  # ! Whole one-day segments: after the 200 h trim at each end 713.85 days remain, so 714 days would stop the setup.
  Tobs: 713 day
  dt: 5 s
  highpass: {cutoff: 1e-5, order: 2, zero_phase: true}
  lowpass: {cutoff: 1e-1, order: 2, zero_phase: true}
  downsample: {window: [kaiser, 31.0]}
  trim: {duration: 200 h, trimming_type: from_each_end}
  alias_correction: true  # the noise model includes the power the decimation folds back
  # Kaiser FIR fitted to the anti-aliasing filter of the Mojito L0 simulation, as mojito_galaxy_psd_v1, whose noise
  # values the runs use (the last full run left it out)
  aafilter: {attenuation: 186.2, freq1: 0.09432, freq2: 0.20585, fs: 4.0}

domain:
  type: stft
  min_freq: 1e-4
  max_freq: 0.09999  # the last bin below the 0.1 Hz Nyquist of the 5 s data; the GB bands follow the GB prior
  segment_duration: 1 day

window:
  type: tukey
  taper_duration: 10000 s  # as the last full run and mojito_galaxy_psd_v1 (Tukey fraction 0.11574)
  normalize: true

# The noise and the foreground are sampled (psd and galfor blocks). The sensitivity model is that of
# mojito_galaxy_psd_v1.
sensitivity:
  class: XYZSensitivityBackend
  kwargs:
    tdi_generation: 2
    mask_percentage: 0.0  # the TDI dips are kept
    smoothing_sigma: 0.0
    average_transfer_functions: true
    noise_symmetry: symmetric
    convolve_window: true  # the covariance is convolved with the window spectrum along frequency
    # Disk and bulge with the closed-form response; the modulation is fixed at the MAP of a direct 1-year MCMC with
    # free modulation, on the remainder of the iterative subtraction (as mojito_galaxy_psd_v1).
    galactic_grid_kwargs:
      R_d: 1.99506849
      z_d: 0.16776102
      f_b: 0.64907336
      r_b: 1.71475300
      N_lambda: 180
      N_beta: 120
      los_center_half_width: 2.5
      los_center_sub: 4
      response: analytic
    psd_batch_size: null  # PSDs per likelihood call; null: all at once
  # # * The fixed noise values of these runs. The user gave them in the sampling basis of the global fit (log10 of the
  # # * amplitudes): PSD [-10.8251649, -14.45044277], foreground [-45.23956511, 4.66423164, -2.60901597, -3.29580792,
  # # * -1.07792288]. The sensitivity takes physical values, as XYZSensitivityBackend.__call__: psd_params [S_oms, S_tm]
  # # * and galfor_params [A, alpha, f1, fknee, f2], so these are 10 ** value (alpha stays). The recipe file turns the
  # # * lists into arrays, which split_psd_params cannot do for a list.
  # fixed_psd_kwargs:
  #   psd_params: [1.4956676488210124e-11, 3.544518357835945e-15]
  #   galfor_params: [5.760164549415233e-46, 4.66423164, 0.002460277132474937, 0.0005060484278901298, 0.0835751413915328]

metadata:
  codename: erebor
  version: mojito_galaxy_psd_v2
  contact: ereborl2d@googlegroups.com
  code_link: https://github.com/Erebor-L2D
  input_data_link: /workspace/ggfitlisa/ldc/mojito_light/
  input_reference: mojito light
  noise_model: parametric-symmetric
  noise_model_code_link: https://github.com/Erebor-L2D
  comment: "Joint GB, VGB, PSD and galactic foreground fit from the galaxy search's candidates, DFFR response, psd and galfor settings of the Quentin galaxy run, and all GB moves."

recipe:
  file: production_recipe.py
  function: setup_recipe
