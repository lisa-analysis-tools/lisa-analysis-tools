# Full-band global fit of the galaxy, the instrument noise and the galactic foreground on the STFT domain
# (DFFR response): the YAML form of mojito_input/galaxy_psd_dffr_global_fit_settings.py. The psd and
# galfor blocks take the stock erebor-priors priors, which sample other ranges than that settings file.
schema_version: 1
run:
  name: gb_psd_galfor_dffr
  output_dir: /workspace/rrondeel/erebor_dev/merge/global_fit_runs/  # the merge environment's runs
  seed: 5701424
  num_iterations: 6  # the psd+galfor search, then 5 joint iterations, as the settings file's recipe
  backup_iter: 1

sampler:
  nwalkers: 32
  ntemps: 24

compute:
  gpus: [0]
  backend: cuda13x
  head_rank: 1
  main_rank: 0

data:
  loader: mojito_l1
  path: /workspace/ggfitlisa/ldc/mojito_light/
  source_types: [gb, vgb, noise]
  # On the host: the setup rebuilds the orbits on the device and never reads this copy's arrays.
  orbits: {type: l1, frame: icrs, armlength: 2493162305.42235, force_backend: cpu}
  Tobs: 713 day  # whole one-day segments, so no partial day is left over
  dt: 5 s
  highpass: {cutoff: 1e-5, order: 2, zero_phase: true}
  lowpass: {cutoff: 1e-1, order: 2, zero_phase: true}
  downsample: {window: [kaiser, 31.0]}
  trim: {duration: 200 h, trimming_type: from_each_end}
  alias_correction: true  # the noise model includes the power the decimation folds back

domain:
  type: stft
  min_freq: 1e-4
  max_freq: 3e-2
  segment_duration: 1 day

window:
  type: tukey
  taper_duration: auto  # 1 / domain.min_freq
  normalize: true

sensitivity:
  class: XYZSensitivityBackend
  kwargs:
    tdi_generation: 2
    mask_percentage: 0.02
    # The galactic grid gives the foreground's sky-averaged geometry at every segment centre.
    galactic_grid_kwargs: {R_d: 2.18, z_d: 0.48, N_lambda: 90, N_beta: 60}
    average_transfer_functions: true

metadata:
  codename: erebor
  version: gb_psd_galfor_dffr
  contact: ereborl2d@googlegroups.com
  code_link: https://github.com/Erebor-L2D
  input_data_link: /workspace/ggfitlisa/ldc/mojito_light/
  input_reference: mojito light
  noise_model: parametric
  noise_model_code_link: https://github.com/Erebor-L2D
  comment: "Full-band GB, PSD and galactic foreground fit, DFFR response, from the galaxy search's candidates."

# recipe: absent -> StockRecipe (the psd+galfor search, then joint PE until run.num_iterations)
