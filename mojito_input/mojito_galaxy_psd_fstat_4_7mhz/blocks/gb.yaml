type: gb
priors: {class: mojitolight.GBPrior}  # its f0 range sets the bands; it is only clipped to the proposed ones
# the most sources at once: 1325 search candidates and 1357 iteratively resolved binaries lie in 4 to 7 mHz
nleaves: 1700
num_prop_repeats: 50
waveform:
  class: GBGPU
  runtime_kwargs: {oversample: 4, tdi_channel_setup: XYZ, tdi2: true}
# DFFR with first-order delays, as in every DFFR run of the GB memory effort
stft: {n_side_bins: 16, response: dffr, linear_envelope: true, use_midpoint: true, first_order_delays: true}
# 12 rungs (sampler.ntemps): beta = 1 / 1.2^k, with the hottest rung at T = 10
tempering: {ratio: 1.2, Tmax: 10}
pe_move:
  class: GBSpecialRJPriorMove
  # births from the prior; stretch_probability 0: every in-model proposal is a Fisher-matrix one
  kwargs:
    stretch_probability: 0.0
    num_stationary_fim_steps: 1
    run_swaps: true
    use_prior_removal: false
    phase_maximize: false
    ranks_needed: 0
# * The F-statistic move takes the pe_move's knobs and runs in all but 1e-4 of the PE iterations: the test runs it
# * alone, and the block keeps the pe_move a share above 0. It searches at every propose (search_interval 1). No band is
# * shut off (the count of silent searches is out of reach), and every search saves its full record, so the analysis
# * reads when a band could have been shut off.
extra_moves:
  fstat:
    class: GBFStatRJMove
    weight: 0.9999
    kwargs:
      fstat_settings: {shutoff_band_iteration: 1000000000, save_search_records: full}
search:
  search_type: catalog
  # ! The galaxy search's candidates strictly inside the sampled f0 range: the catalogue search has no f0 filter, and a
  # ! row outside the range stops the seeding.
  search_path: /workspace/rrondeel/erebor_dev/data/gb_candidates_4_7mhz.hdf5
  # ln A, f0 [mHz], fdot, phi0, cos iota, psi, alpha, sin delta; hotter chains are wider
  spread: [1e-3, 1e-9, 1e-19, 1e-3, 1e-3, 1e-3, 1e-4, 1e-4]
  max_resample_tries: 2000
  # the STFT computations take the parameters at the catalogue epoch, where the candidates are; one phase copy per
  # candidate, as the control, which started before the seeding at the four copies
  kwargs: {evolve_to_data_start: false, seed_phase_copies: false}
links:
  waveform_model_code_link: https://github.com/Erebor-L2D/GBGPU/tree/cd1l-run0
  prior_model_code_link: https://github.com/Erebor-L2D/erebor-priors/blob/fb65c565aea06c62a41ddbe95bb6b40a1a9c04b6/src/ereborpriors/stock/mojitolight/gb.py
