# Test band of the F-statistic RJ move: the joint fit of mojito_galaxy_psd_v1 (GB block with GBs and VGBs, instrument
# noise, galactic foreground; 713 days of Mojito light, started from the galaxy search's candidates) on 4 to 7 mHz, with
# the F-statistic move as the GB block's RJ move. The band crosses the 6 mHz edge of the foreground, where the search's
# gate changes and above which a band can be shut off. mojito_galaxy_psd_v1, which runs the prior move, is the control;
# this folder copies its settings except the domain, the window taper, the GB move, nleaves and the candidates file.
schema_version: 1
run:
  name: mojito_galaxy_psd_fstat_4_7mhz
  output_dir: /workspace/rrondeel/erebor_dev/global_fit_runs/mojito_galaxy_psd_fstat_4_7mhz/
  seed: 20261030
  num_iterations: 400
  backup_iter: 5

sampler:
  nwalkers: 32
  ntemps: 12

compute:
  # * 16 walkers per card, as the control
  gpus: [0, 1]
  backend: cuda13x
  head_rank: 1
  main_rank: 0

data:
  loader: mojito_l1
  path: /workspace/ggfitlisa/ldc/mojito_light/
  source_types: [gb, vgb, noise]
  # On the host: the setup rebuilds the orbits on the device and never reads this copy's arrays.
  orbits: {type: l1, frame: icrs, armlength: 2493162305.42235, force_backend: cpu}
  Tobs: 713 day
  dt: 5 s
  highpass: {cutoff: 1e-5, order: 2, zero_phase: true}
  lowpass: {cutoff: 1e-1, order: 2, zero_phase: true}
  downsample: {window: [kaiser, 31.0]}
  trim: {duration: 200 h, trimming_type: from_each_end}
  alias_correction: true  # the noise model includes the power the decimation folds back
  # Kaiser FIR fitted to the anti-aliasing filter of the Mojito L0 simulation (4 Hz -> 0.4 Hz decimation)
  aafilter: {attenuation: 186.2, freq1: 0.09432, freq2: 0.20585, fs: 4.0}

domain:
  type: stft
  # the test band; the GB bands follow the GB prior, clipped to the proposed bands inside it
  min_freq: 4e-3
  max_freq: 7e-3
  segment_duration: 1 day

window:
  type: tukey
  # the control's taper: its auto value is 1 / domain.min_freq = 1e4 s at 1e-4 Hz
  taper_duration: 10000 s
  normalize: true

sensitivity:
  class: XYZSensitivityBackend
  kwargs:
    tdi_generation: 2
    mask_percentage: 0.0  # the TDI dips are kept
    smoothing_sigma: 0.0
    average_transfer_functions: true
    noise_symmetry: symmetric
    convolve_window: true  # the covariance is convolved with the window spectrum along frequency
    # Disk and bulge with the closed-form response; the modulation is fixed at the MAP of a direct 1-year MCMC
    # with free modulation, on the remainder of the iterative subtraction.
    galactic_grid_kwargs:
      R_d: 1.99506849
      z_d: 0.16776102
      f_b: 0.64907336
      r_b: 1.71475300
      N_lambda: 180
      N_beta: 120
      los_center_half_width: 2.5
      los_center_sub: 4
      response: analytic
    psd_batch_size: null  # PSDs per likelihood call; null: all at once

metadata:
  codename: erebor
  version: mojito_galaxy_psd_fstat_4_7mhz
  contact: ereborl2d@googlegroups.com
  code_link: https://github.com/Erebor-L2D
  input_data_link: /workspace/ggfitlisa/ldc/mojito_light/
  input_reference: mojito light
  noise_model: parametric-symmetric
  noise_model_code_link: https://github.com/Erebor-L2D
  comment: "Test band of the F-statistic RJ move: mojito_galaxy_psd_v1 on 4 to 7 mHz with the F-statistic move as the GB RJ move, no band shut off, every search record saved."

# recipe: absent -> StockRecipe (the psd+galfor search, then joint PE until run.num_iterations)
