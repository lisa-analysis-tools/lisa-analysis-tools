# Joint fit of the galaxy (GB block), the instrument noise and the galactic foreground on 714 days of Mojito light
# (noise, GBs and VGBs). The psd and galfor settings are those of mojito_input/galfor_psd_quentin_galaxy_settings.py,
# whose galaxy is the remainder of an iterative subtraction on this data set, with the stock erebor-priors priors.
schema_version: 1
run:
  name: galaxy_psd_filter_response
  output_dir: /workspace/rrondeel/erebor_dev/merge/global_fit_runs/  # the merge environment's runs
  seed: 20261030
  num_iterations: 400
  backup_iter: 5

sampler:
  nwalkers: 32
  ntemps: 12

compute:
  gpus: [0]
  backend: cuda13x
  head_rank: 1
  main_rank: 0

data:
  loader: mojito_l1
  path: /workspace/ggfitlisa/ldc/mojito_light/
  source_types: [gb, vgb, noise]
  # On the host: the setup rebuilds the orbits on the device and never reads this copy's arrays.
  orbits: {type: l1, frame: icrs, armlength: 2493162305.42235, force_backend: cpu}
  Tobs: 714 day  # whole one-day segments, so no partial day is left over
  dt: 5 s
  highpass: {cutoff: 1e-5, order: 2, zero_phase: true}
  lowpass: {cutoff: 1e-1, order: 2, zero_phase: true}
  downsample: {window: [kaiser, 31.0]}
  trim: {duration: 200 h, trimming_type: from_each_end}
  alias_correction: true  # the noise model includes the power the decimation folds back
  # Kaiser FIR fitted to the anti-aliasing filter of the Mojito L0 simulation (4 Hz -> 0.4 Hz decimation)
  upstream_aafilter: {attenuation: 186.2, freq1: 0.09432, freq2: 0.20585, fs: 4.0}

domain:
  type: stft
  min_freq: 1e-4
  max_freq: 0.09999  # the last bin below the 0.1 Hz Nyquist of the 5 s data; the GB bands follow the GB prior
  segment_duration: 1 day

window:
  type: tukey
  taper_duration: auto  # 1 / domain.min_freq
  normalize: true

sensitivity:
  class: XYZSensitivityBackend
  kwargs:
    tdi_generation: 2
    mask_percentage: 0.0  # the TDI dips are kept
    smoothing_sigma: 0.0
    average_transfer_functions: true
    noise_symmetry: symmetric
    convolve_window: true  # the covariance is convolved with the window spectrum along frequency
    # Disk and bulge with the closed-form response; the modulation is fixed at the MAP of a direct 1-year MCMC
    # with free modulation, on the remainder of the iterative subtraction.
    galactic_grid_kwargs:
      R_d: 1.99506849
      z_d: 0.16776102
      f_b: 0.64907336
      r_b: 1.71475300
      N_lambda: 180
      N_beta: 120
      los_center_half_width: 2.5
      los_center_sub: 4
      response: analytic
    psd_batch_size: null  # PSDs per likelihood call; null: all at once

metadata:
  codename: erebor
  version: gb_psd_galfor_quentin
  contact: ereborl2d@googlegroups.com
  code_link: https://github.com/Erebor-L2D
  input_data_link: /workspace/ggfitlisa/ldc/mojito_light/
  input_reference: mojito light
  noise_model: parametric-symmetric
  noise_model_code_link: https://github.com/Erebor-L2D
  comment: "Joint GB, PSD and galactic foreground fit, DFFR response, psd and galfor settings of the Quentin galaxy run."

# recipe: absent -> StockRecipe (the psd+galfor search, then joint PE until run.num_iterations)
