name: Build and publish wheels
on:
  release:
    types: [published]
  push:
    branches: ['**'] # branches only, so tag pushes don't start a second run
  workflow_dispatch: # manual build-only run from the Actions tab / `gh workflow run`
permissions:
  contents: read
# Never interrupt a real in-flight release
# Ok to interrupt test runs on push or workflow_dispatch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'release' }}
jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.select.outputs.build }}
      publish: ${{ steps.select.outputs.publish }}
      core-suffix: ${{ steps.select.outputs.core-suffix }}
    steps:
      - name: initialize
        run: |
          {
            echo "LISATOOLSWHL_BUILD=false"
            echo "LISATOOLSWHL_CORE_SUFFIX=false"
            echo "LISATOOLSWHL_PUBLISH=false"
          } >> "$GITHUB_ENV"
      - name: build on commit message
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[ci:build-wheels]')
        run: |
          echo "LISATOOLSWHL_BUILD=true" >> "$GITHUB_ENV"
      - name: publish wheels on commit message
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[ci:publish-wheels]')
        run: |
          {
            echo "LISATOOLSWHL_BUILD=true"
            echo "LISATOOLSWHL_PUBLISH=true"
          } >> "$GITHUB_ENV"
      - name: build wheels on manual dispatch
        if: github.event_name == 'workflow_dispatch'
        run: |
            echo "LISATOOLSWHL_BUILD=true" >> "$GITHUB_ENV"
      - name: build and publish on tag 'v*'
        if: github.event_name == 'release' && startsWith(github.ref, 'refs/tags/v')
        run: |
          {
            echo "LISATOOLSWHL_BUILD=true"
            echo "LISATOOLSWHL_PUBLISH=true"
          } >> "$GITHUB_ENV"
      - name: add core-suffix on non-official repo
        if: github.event.repository.full_name != 'mikekatz04/LISAanalysistools'
        run: |
          echo "LISATOOLSWHL_CORE_SUFFIX=true" >> "$GITHUB_ENV"
      - name: output results
        id: select
        run: |
          {
            echo "build=$LISATOOLSWHL_BUILD"
            echo "publish=$LISATOOLSWHL_PUBLISH"
            echo "core-suffix=$LISATOOLSWHL_CORE_SUFFIX"
          } >> "$GITHUB_OUTPUT"
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.setuptools_scm.outputs.value }}
    steps:
      # =========================
      # = I - Retrieve sources  =
      # =========================
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      # ===================================
      # = II - Prepare Python environment =
      # ===================================
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: |
          pip install setuptools_scm==10.3.4

      # ========================
      # = III - Detect version =
      # ========================
      - name: Update version scheme
        run: |
          sed -i'' -e 's|version_scheme = "no-guess-dev"|version_scheme = "only-version"|g' pyproject.toml
          sed -i'' -e 's|local_scheme = "node-and-date"|local_scheme = "no-local-version"|g' pyproject.toml
      - name: Detect current version
        id: setuptools_scm
        run: |
          VERSION="$(python -m setuptools_scm)"
          if [[ ! "$VERSION" =~ ^[0-9]+(\.[0-9]+)*((a|b|rc)[0-9]+)?(\.post[0-9]+)?(\.dev[0-9]+)?$ ]]; then
            echo "::error::Unexpected version string."
            exit 1
          fi
          echo "::notice:: Detected version: ${VERSION}"
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "version: ${VERSION}" >> "$GITHUB_STEP_SUMMARY"

      # =======================
      # = IV - install llvm   =
      # =======================
      # - name: Install LLVM and Clang
      #   uses: KyleMayes/install-llvm-action@v2
      #   with:
      #     version: "17.0"
      #     directory: ${{ runner.temp }}/llvm
      
  build:
    name: lisaanalysistools-${{ matrix.release }} on ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    needs:
      - select
      - version
    if: needs.select.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - release: cpu
            os: ubuntu-latest
            arch: x86_64
            kind: core
            reqpython: '>=3.10'
          # - release: cuda11x
          #   os: ubuntu-latest
          #   arch: x86_64
          #   kind: cuda_plugin
          #   cuda_major: 11
          #   cuda_minor: 8
          #   reqpython: '>=3.10'
          - release: cuda12x
            os: ubuntu-latest
            arch: x86_64
            kind: cuda_plugin
            cuda_major: 12
            cuda_minor: 4
            reqpython: '>=3.10'
          - release: cuda13x
            os: ubuntu-latest
            arch: x86_64
            kind: cuda_plugin
            cuda_major: 13
            cuda_minor: 4
            reqpython: '>=3.10'
          - release: cpu
            os: ubuntu-latest
            arch: aarch64
            kind: core
            reqpython: '>=3.10'
          # - release: cuda11x
          #   os: ubuntu-latest
          #   arch: aarch64
          #   kind: cuda_plugin
          #   cuda_major: 11
          #   cuda_minor: 8
          # - release: cuda12x
          #   os: ubuntu-latest
          #   arch: aarch64
          #   kind: cuda_plugin
          #   cuda_major: 12
          #   cuda_minor: 6
          # - release: cpu
          #   os: macos-15-intel
          #   kind: core
          #   reqpython: '>=3.10'
          #   arch: x86_64
          #   macos_ver: 15.0
          - release: cpu
            os: macos-15
            kind: core
            reqpython: '>=3.10'
            arch: arm64
            macos_ver: 15.0
          - release: cpu
            os: macos-14
            kind: core
            reqpython: '>=3.10'
            arch: arm64
            macos_ver: 14.0
    steps:
      # =========================
      # = I - Retrieve sources  =
      # =========================
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # ========================
      # = II - Update sources  =
      # ========================
      - name: Add release suffix to project name
        if: matrix.kind != 'core'
        run: |
          sed -i'' -e 's|" #@NAMESUFFIX@|-${{ matrix.release }}"|g' pyproject.toml
      - name: Add release suffix to core package for TestPyPI
        if: matrix.kind == 'core' && needs.select.outputs.core-suffix == 'true'
        run: |
          sed -i'' -e 's|" #@NAMESUFFIX@|-${{ matrix.release }}"|g' pyproject.toml
      - name: Add cuda1xx python dependency for lisatools.
        if: matrix.kind == 'cuda_plugin'
        run: |
          sed -i -e 's/) #@ADDCUDAHERE@/ CUDA)/g' CMakeLists.txt
      # sed -i'' -e 's|" #@LISATOOLS_CUDA@|lisaanalysistools-${{ matrix.release }}"|g' pyproject.toml
      # Add CuPy dependency
      - name: Add Cupy dependency
        if: matrix.kind == 'cuda_plugin'
        run: |
          sed -i'' -e 's|#@DEPS_CUPYCUDA@|"cupy-cuda${{ matrix.cuda_major }}x"|g' pyproject.toml
      # Add Core project dependency
      - name: Add core project dependency on plugin
        if: matrix.kind != 'core' && needs.select.outputs.core-suffix == 'true'
        env:
          LISATOOLS_VERSION: ${{ needs.version.outputs.version }}
        run: |
          sed -i'' -e "s|#@DEPS_LISATOOLSCORE@|\"lisaanalysistools-cpu==${LISATOOLS_VERSION}\"|g" pyproject.toml
      - name: Add core project dependency on plugin
        if: matrix.kind != 'core' && needs.select.outputs.core-suffix == 'false'
        env:
          LISATOOLS_VERSION: ${{ needs.version.outputs.version }}
        run: |
          sed -i'' -e "s|#@DEPS_LISATOOLSCORE@|\"lisaanalysistools==${LISATOOLS_VERSION}\"|g" pyproject.toml
      # Remove base sources from plugin wheels
      - name: Exclude core package from plugins
        if: matrix.kind != 'core'
        run: |
          sed -i'' -e '/@SKIP_PLUGIN@/d' pyproject.toml
      # ===================================
      # = III. Prepare build environment  =
      # ===================================
      - name: Set up QEMU
        if: matrix.os == 'ubuntu-latest' && matrix.arch != 'x86_64'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: all
      # =====================
      # = IV. Build wheels  =
      # =====================
      - uses: fortran-lang/setup-fortran@1f630c95fa9e0c941248f52e4674260139020365 # v1.11.0
        if: matrix.kind == 'core'
        id: setup-fortran
        with:
          compiler: gcc
          version: 14
      - name: Build core wheels (macOS)
        if: runner.os == 'macOS' && matrix.kind == 'core'
        uses: pypa/cibuildwheel@f9b966cfadf4109556cadc5bb39ddb72d0ce664e # v4.3.5
        env:
          CIBW_SKIP: cp3??t-*
          CIBW_PROJECT_REQUIRES_PYTHON: ${{ matrix.reqpython }}
          CIBW_ARCHS_MACOS: ${{ matrix.arch }}
          CIBW_CONFIG_SETTINGS: >
            cmake.define.LISATOOLS_WITH_GPU=OFF
          # TODO: check this
          # CIBW_TEST_COMMAND: python -m lisaanalysistools.tests --disable testfile
          CIBW_ENVIRONMENT: >
            SETUPTOOLS_SCM_PRETEND_VERSION="${{ needs.version.outputs.version }}"
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_ver }}
      - name: Build core wheels (Linux)
        if: runner.os == 'Linux' && matrix.kind == 'core'
        uses: pypa/cibuildwheel@f9b966cfadf4109556cadc5bb39ddb72d0ce664e # v4.3.5
        env:
          CIBW_PROJECT_REQUIRES_PYTHON: ${{ matrix.reqpython }}
          CIBW_ARCHS_LINUX: ${{ matrix.arch }}
          CIBW_SKIP: cp3??t-* *musllinux*
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_28
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_CONFIG_SETTINGS: >
            cmake.define.LISATOOLS_WITH_GPU=OFF
          CIBW_ENVIRONMENT: >
            SETUPTOOLS_SCM_PRETEND_VERSION="${{ needs.version.outputs.version }}"
          # CIBW_TEST_COMMAND: python -m lisaanalysistools.tests --disable testfile
      - name: Build cuda plugin wheels (Linux)
        if: runner.os == 'Linux' && matrix.kind == 'cuda_plugin' && matrix.arch == 'x86_64'
        uses: pypa/cibuildwheel@f9b966cfadf4109556cadc5bb39ddb72d0ce664e # v4.3.5
        env:
          CIBW_PROJECT_REQUIRES_PYTHON: ${{ matrix.reqpython }}
          CIBW_ARCHS_LINUX: ${{ matrix.arch }}
          CIBW_SKIP: cp3??t-* *musllinux*
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_28
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28 
          CIBW_CONFIG_SETTINGS: >
            cmake.define.LISATOOLS_WITH_GPU=ONLY
            cmake.define.LISATOOLS_CUDA_ARCH="70;75;80;86;90"
          # Use dnf to install cuda-toolkit and gcc inside the manylinux container
          CIBW_BEFORE_ALL: >
            dnf clean all &&
            dnf install -y scl-utils &&
            dnf install -y gcc-toolset-13 && 
            source scl_source enable gcc-toolset-13 &&
            dnf -y install epel-release &&
            dnf config-manager --add-repo https://developer.download.nvidia.com/compute/cuda/repos/rhel7/x86_64/cuda-rhel7.repo &&
            dnf -y install cuda-toolkit-${{ matrix.cuda_major }}-${{ matrix.cuda_minor }}.${{ matrix.arch }} &&
            ls -al /usr/local &&
            export PATH=$PATH:/usr/local/cuda/bin &&
            nvcc --version
          CIBW_BEFORE_BUILD: source scl_source enable gcc-toolset-13
          CIBW_ENVIRONMENT: >
            PATH="/usr/local/cuda/bin:${PATH}"
            LD_LIBRARY_PATH="/usr/local/cuda/lib64:${LD_LIBRARY_PATH}"
            CUDA_HOME=/usr/local/cuda
            CUDA_ROOT=/usr/local/cuda
            CUDA_PATH=/usr/local/cuda
            CUDADIR=/usr/local/cuda
            CC=gcc
            CXX=g++
            CUDACXX="nvcc -ccbin /opt/rh/gcc-toolset-13/root/usr/bin/gcc"
            SETUPTOOLS_SCM_PRETEND_VERSION="${{ needs.version.outputs.version }}"
          CIBW_REPAIR_WHEEL_COMMAND: auditwheel -v repair -w {dest_dir} {wheel} --exclude "libcudart.so.${{ matrix.cuda_major }}" --exclude "libcusparse.so.${{ matrix.cuda_major }}" --exclude "libcublas.so.${{ matrix.cuda_major }}" --exclude "libnvJitLink.so.${{ matrix.cuda_major }}" --exclude "libcublasLt.so.${{ matrix.cuda_major }}"
      # =====================
      # = V. Upload wheels  =
      # =====================
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cibw-wheels-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl
          if-no-files-found: error
  publish:
    runs-on: ubuntu-latest
    environment: pypiconf
    defaults:
      run:
        shell: bash
    needs:
      - build
      - select
    if: github.event_name == 'release' && needs.select.outputs.publish == 'true'
    permissions:
      # IMPORTANT: this permission is mandatory for trusted publishing
      id-token: write
    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: wheelhouse/
          merge-multiple: true
      - name: List wheels
        run: |
          ls -al wheelhouse/*
      - name: Install twine from PyPI
        uses: install-pinned/twine@c7ca21f7f66fc895b73cba784dc1d0e302e3b4a3 # 6.1.0
      - name: Publish release distributions to registry
        env:
          TWINE_NON_INTERACTIVE: "yes"
          TWINE_PASSWORD: ${{ secrets.TWINE_PASSWORD }}
          TWINE_REPOSITORY: ${{ vars.TWINE_REPOSITORY }}
          TWINE_USERNAME: ${{ vars.TWINE_USERNAME }}
        run: |
          ls -lh wheelhouse/*
          twine upload wheelhouse/*
